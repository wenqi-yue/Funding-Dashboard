<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funding Opportunities Intelligence — Locked</title>
<style>
:root{--brand:#1f5f8b;--brand-2:#12897e;--bg:#0f1b26;--ink:#e8eef4;--muted:#9fb2c2;--line:#22384a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a2f42,#0f1b26);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.gate{width:100%;max-width:420px;background:rgba(18,32,45,.7);border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.lock{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.lock svg{width:24px;height:24px;fill:#fff}
h1{font-size:19px;margin:0 0 6px}
p.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:8px}
input{flex:1;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#0c1620;color:var(--ink);font-size:15px}
input:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
button{padding:11px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2.5px solid #fff;outline-offset:2px}
.err{color:#ff8a80;font-size:13px;margin-top:12px;min-height:18px}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted)}
</style>
</head>

    <p class="sub">This board is password-protected. Enter the password to view current grants, foundations, corporate &amp; pharma programs, prizes, tech/AI funds, equipment, and international opportunities.</p>
    <form id="f" autocomplete="off">
      <label for="pw">Password</label>
      <div class="row">
        <input id="pw" type="password" placeholder="Enter password" autofocus>
        <button id="go" type="submit">Unlock</button>
      </div>
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="foot">Encrypted client-side (AES-GCM). Nothing is sent to a server.</div>

function b64d(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function unlock(pw){
  const salt=b64d(DATA.salt), iv=b64d(DATA.iv), ct=b64d(DATA.ct);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return new TextDecoder().decode(buf);
}
const f=document.getElementById('f'), pw=document.getElementById('pw'), err=document.getElementById('err'), go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Unlocking…';
  try{
    const html=await unlock(pw.value);
    document.open(); document.write(html); document.close();
  }catch(ex){
    err.textContent='Incorrect password. Please try again.';
    go.disabled=false; go.textContent='Unlock'; pw.select();
  }
});
